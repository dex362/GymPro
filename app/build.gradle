plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gympro.coach'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gympro.coach'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    // Fixed key so every new build installs as an update (your data is kept)
    signingConfigs {
        fixed {
            storeFile file('gympro.keystore')
            storePassword 'gympro123'
            keyAlias 'gympro'
            keyPassword 'gympro123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
