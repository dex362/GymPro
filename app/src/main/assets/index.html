<html lang="ar" dir="rtl">
<head>

<meta name="theme-color" content="#0f1115">
<title>GymPro Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--tx:#e9ecf1;--mut:#8a93a3;--acc:#c6ff3d;--acc2:#7cd4ff;--warn:#ffb547;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.brand{font-weight:800;font-size:20px;letter-spacing:.3px}.brand b{color:var(--acc)}
.lang{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:12px 0 6px;color:var(--acc)}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
.btn{background:var(--acc);color:#111;border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{white-space:nowrap;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--acc);color:#111;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;text-align:center}
.ex svg{width:100%;height:auto;background:var(--card2);border-radius:10px}
.ex .nm{font-weight:700;font-size:13.5px;margin-top:4px;line-height:1.35}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:8px;cursor:pointer}
.list .it:last-child{border-bottom:0}
.rx{font-weight:800;color:var(--acc);white-space:nowrap;direction:ltr}
input,select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
label{font-size:13px;color:var(--mut);display:block;margin:6px 0 3px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:9px;background:var(--card2);border-radius:99px;overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.kpi div{background:var(--card2);border-radius:12px;padding:8px 2px}
.kpi b{display:block;font-size:17px;direction:ltr}.kpi span{font-size:11.5px;color:var(--mut)}
nav.bn{position:fixed;bottom:0;left:0;right:0;background:#12151bf2;border-top:1px solid var(--line);display:flex;justify-content:center;backdrop-filter:blur(8px);z-index:20}
nav.bn .in{display:flex;max-width:560px;width:100%}
nav.bn button{flex:1;background:none;border:0;padding:8px 0 10px;cursor:pointer;color:var(--mut);font-size:11.5px;font-weight:700}
nav.bn button .ic{display:block;font-size:20px;line-height:1.3}
nav.bn button.on{color:var(--acc)}
.sheet{position:fixed;inset:0;background:#000a;display:none;z-index:30;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .pan{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;border:1px solid var(--line);padding:14px 14px 30px}
.x{background:var(--card2);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:16px}
.fig{background:var(--card2);border-radius:14px;padding:4px;position:relative}
.fig svg{width:100%;height:auto;display:block;direction:ltr}
ul.b{margin:4px 0;padding-inline-start:20px}ul.b li{margin:3px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
summary{cursor:pointer;font-weight:700}
.warn{border-color:#5a4520;background:#221c10;color:#ffd99a}
.ok{color:var(--acc)}
a{color:var(--acc2)}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sets span{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:13px;direction:ltr}
.del{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px;padding:0 4px}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);cursor:pointer;font-weight:800}
.qty b{min-width:42px;text-align:center;direction:ltr}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--acc);color:#111;padding:8px 16px;border-radius:999px;font-weight:800;z-index:40;display:none}
</style>
</head>

{id:'lunge',g:'legs',q:'dumbbell lunge form',n:B('لانجز بالدمبل','Dumbbell Lunge'),m:B('الفخذ الأمامي، المؤخرة، التوازن','Quads, glutes, balance'),

 s:B(['سنّد أسفل لوح الكتف على طرف البنش.','البار على الحوض (استخدم مخدة/Pad).','الرجلين على الأرض بعرض الحوض.','ارفع الحوض لحد ما الجسم يبقى خط مستقيم من الكتف للركبة.','اعصر المؤخرة ثانية فوق وانزل بتحكم.'],['Rest your lower shoulder blades on the edge of a bench.','Bar across your hips (use a pad).','Feet flat, hip-width apart.','Drive your hips up until shoulders-to-knees is a straight line.','Squeeze the glutes for 1 second at the top, lower under control.']),

{id:'incline',g:'chest',q:'incline dumbbell press form',n:B('إنكلاين دمبل برس','Incline Dumbbell Press'),m:B('الصدر العلوي، الكتف الأمامي، الترايسبس','Upper chest, front delts, triceps'),

{id:'row',g:'back',q:'barbell row form',n:B('بار رو (تجديف بالبار)','Barbell Row'),m:B('الضهر الأوسط، اللاتس، الكتف الخلفي، البايسبس','Mid back, lats, rear delts, biceps'),

/* ============ FIGURE ENGINE ============ */
const LEN={shin:46,thigh:48,torso:58,ua:32,fa:30};
const dirv=d=>{const r=d*Math.PI/180;return[Math.sin(r),-Math.cos(r)]};
function ik(p0,p2,l1,l2,pref){
  let dx=p2[0]-p0[0],dy=p2[1]-p0[1],d=Math.hypot(dx,dy);if(d<1e-6){dx=0;dy=1;d=1}
  const ux=dx/d,uy=dy/d,max=l1+l2-0.01,min=Math.abs(l1-l2)+0.01;
  const dm=Math.min(Math.max(d,min),max);
  const end=d>max?[p0[0]+ux*dm,p0[1]+uy*dm]:p2;
  const a=(l1*l1-l2*l2+dm*dm)/(2*dm),hh=Math.sqrt(Math.max(0,l1*l1-a*a));
  const mx=p0[0]+ux*a,my=p0[1]+uy*a;
  const s1=[mx-uy*hh,my+ux*hh],s2=[mx+uy*hh,my-ux*hh];
  let j;
  if(pref==='f')j=s1[0]>=s2[0]?s1:s2;else if(pref==='b')j=s1[0]<s2[0]?s1:s2;
  else if(pref==='u')j=s1[1]<s2[1]?s1:s2;else j=s1[1]>=s2[1]?s1:s2;
  return[j,end];
}
const lerp=(a,b,k)=>a+(b-a)*k, lerp2=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k)];
function solve(P){
  const hip=P.h,td=dirv(P.t),sh=[hip[0]+td[0]*LEN.torso,hip[1]+td[1]*LEN.torso];
  const [knee,ank]=ik(hip,P.a,LEN.thigh,LEN.shin,P.kb||'f');
  const tg=P.hd?P.hd:[sh[0]+P.ho[0],sh[1]+P.ho[1]];
  const [elb,hand]=ik(sh,tg,LEN.ua,LEN.fa,P.eb||'d');
  const o={hip,sh,knee,ank,elb,hand,head:[sh[0]+td[0]*15,sh[1]+td[1]*15],toe:P.toe||[ank[0]+13,ank[1]+1],t:P.t};
  if(P.a2){const[k2,a2]=ik(hip,P.a2,LEN.thigh,LEN.shin,P.kb2||'d');o.knee2=k2;o.ank2=a2;o.toe2=[a2[0]+13,a2[1]+1]}
  return o;
}
function poseAt(pose,k){
  const A=pose.A,Bp=pose.B||A,P={t:lerp(A.t||0,Bp.t??A.t??0,k),kb:k<.5?A.kb:(Bp.kb||A.kb),eb:k<.5?A.eb:(Bp.eb||A.eb),kb2:k<.5?A.kb2:(Bp.kb2||A.kb2)};
  ['h','a','a2','toe'].forEach(n=>{if(A[n])P[n]=lerp2(A[n],Bp[n]||A[n],k)});
  // hand: mix absolute/offset by resolving both to absolute
  const sA=solveSh(A),sB=solveSh(Bp);
  const hA=A.hd||[sA[0]+A.ho[0],sA[1]+A.ho[1]],hB=Bp.hd||[sB[0]+Bp.ho[0],sB[1]+Bp.ho[1]];
  P.hd=lerp2(hA,hB,k);
  const o=solve(P);
  if(pose.abd){const a=lerp(pose.abd[0],pose.abd[1],k),r=a*Math.PI/180;o.abd=a;
    o.elb=[o.sh[0]+LEN.ua*.1,o.sh[1]+LEN.ua*Math.cos(r)];o.hand=[o.sh[0]+(LEN.ua+LEN.fa)*.15,o.sh[1]+(LEN.ua+LEN.fa)*Math.cos(r)*.97]}
  return o;
}
function solveSh(p){const td=dirv(p.t||0);return[p.h[0]+td[0]*LEN.torso,p.h[1]+td[1]*LEN.torso]}
function ang(j,a,b){const v1=[a[0]-j[0],a[1]-j[1]],v2=[b[0]-j[0],b[1]-j[1]];const c=(v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(...v1)*Math.hypot(...v2));return Math.acos(Math.max(-1,Math.min(1,c)))*180/Math.PI}
function arc(j,a,b,r,lbl){
  const n=v=>{const l=Math.hypot(v[0],v[1])||1;return[v[0]/l,v[1]/l]};
  const u1=n([a[0]-j[0],a[1]-j[1]]),u2=n([b[0]-j[0],b[1]-j[1]]);
  const cr=u1[0]*u2[1]-u1[1]*u2[0],sw=cr>0?1:0;
  const p1=[j[0]+u1[0]*r,j[1]+u1[1]*r],p2=[j[0]+u2[0]*r,j[1]+u2[1]*r];
  let m=n([u1[0]+u2[0],u1[1]+u2[1]]);if(!isFinite(m[0])||(Math.abs(u1[0]+u2[0])<.05&&Math.abs(u1[1]+u2[1])<.05))m=[-u1[1],u1[0]];
  const lp=[j[0]+m[0]*(r+15),j[1]+m[1]*(r+15)];
  return `<path d="M${p1[0].toFixed(1)},${p1[1].toFixed(1)} A${r},${r} 0 0 ${sw} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="none" stroke="#c6ff3d" stroke-width="2.2"/>`+
  `<g transform="translate(${lp[0].toFixed(1)},${lp[1].toFixed(1)})"><rect x="-17" y="-9" width="34" height="17" rx="8" fill="#0f1115" stroke="#c6ff3d" stroke-width="1"/><text x="0" y="4.5" text-anchor="middle" font-size="11" font-weight="800" fill="#c6ff3d" font-family="Cairo,sans-serif">${lbl}</text></g>`;
}
function ln(a,b,w,c){return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`}
function plate(p){return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="20" fill="#2b313d" stroke="#55607a" stroke-width="2"/><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#8a93a3"/>`}

/* ---- human figure ---- */
const SK='#d9a77c',SKD='#a97d58',SHIRT='#2f6fed',SHIRTD='#2559c4',SHORTS='#465066',SHOE='#0b0c10',HAIR='#2a1d14',HLC='#ff3b3b';
const HL={squat:['thigh','glute'],rdl:['thigh','glute'],deadlift:['thigh','glute','back'],lunge:['thigh','glute'],hipthrust:['glute','thigh'],legext:['thigh'],calf:['shin'],
 bench:['chest','ua'],incline:['chest','shoulder'],pushup:['chest','ua'],dips:['chest','ua'],pullup:['back','ua'],row:['back','shoulder'],cablerow:['back','ua'],
 facepull:['shoulder'],lateral:['shoulder'],ohp:['shoulder','ua'],curl:['ua'],hammer:['ua','fa'],pushdown:['ua'],plank:['abs'],kneeraise:['abs','thigh']};
const f1=v=>v.toFixed(1);
function cap(a,b,ra,rb,fill,op){const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,px=-dy/l,py=dx/l;
 return `<g fill="${fill}"${op!=null?` opacity="${op.toFixed(2)}"`:''}><path d="M${f1(a[0]+px*ra)},${f1(a[1]+py*ra)} L${f1(b[0]+px*rb)},${f1(b[1]+py*rb)} L${f1(b[0]-px*rb)},${f1(b[1]-py*rb)} L${f1(a[0]-px*ra)},${f1(a[1]-py*ra)}Z"/><circle cx="${f1(a[0])}" cy="${f1(a[1])}" r="${ra}"/><circle cx="${f1(b[0])}" cy="${f1(b[1])}" r="${rb}"/></g>`}
const mixp=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
function ell(c,rx,ry,deg,op){return `<ellipse cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${rx}" ry="${ry}" transform="rotate(${f1(deg)} ${f1(c[0])} ${f1(c[1])})" fill="${HLC}" opacity="${op.toFixed(2)}"/>`}
function poly(pts,fill){return `<path d="M${pts.map(p=>f1(p[0])+','+f1(p[1])).join(' L')}Z" fill="${fill}" stroke="${fill}" stroke-width="5" stroke-linejoin="round"/>`}
function person(o,hl,k,sup){
  const td=dirv(o.t),sg=sup?-1:1,n=[-td[1]*sg,td[0]*sg],P=(b,a,c)=>[b[0]+td[0]*a+n[0]*c,b[1]+td[1]*a+n[1]*c];
  const L=LEN.torso,op=0.28+0.5*k,has=x=>hl.includes(x),deg=Math.atan2(td[1],td[0])*180/Math.PI;
  let s='';
  if(o.knee2)s+=cap(o.knee2,o.ank2,6,4,SKD)+cap(o.hip,o.knee2,8.2,6,SKD)+cap(o.hip,mixp(o.hip,o.knee2,.55),9.3,8,'#353d4f')+cap(o.ank2,o.toe2,4.4,3.6,SHOE);
  // near leg
  s+=cap(o.knee,o.ank,6.4,4.2,SK);if(has('shin'))s+=cap(mixp(o.knee,o.ank,.1),mixp(o.knee,o.ank,.7),6,4.5,HLC,op);
  s+=cap(o.hip,o.knee,8.6,6.3,SK);if(has('thigh'))s+=cap(mixp(o.hip,o.knee,.5),mixp(o.hip,o.knee,.92),7.6,5.6,HLC,op);
  s+=cap(o.hip,mixp(o.hip,o.knee,.55),9.6,8.2,SHORTS);
  s+=cap(o.ank,o.toe,4.6,3.8,SHOE);
  // torso
  s+=poly([P(o.hip,-1,-9),P(o.hip,-1,8),P(o.hip,L*.42,7.5),P(o.hip,L*.76,11),P(o.sh,3,8),P(o.sh,5,-5),P(o.hip,L*.55,-9.5)],SHIRT);

  if(has('chest'))s+=ell(P(o.hip,L*.74,6.5),9,5,deg,op);
  if(has('abs'))s+=ell(P(o.hip,L*.36,4.5),10,4.2,deg,op);
  if(has('back'))s+=ell(P(o.hip,L*.62,-5),14,5,deg,op);
  if(has('glute'))s+=ell(P(o.hip,2,-4.5),7,6,deg,op);

  s+=`<circle cx="${f1(hh[0])}" cy="${f1(hh[1])}" r="10.2" fill="${HAIR}"/><circle cx="${f1(fc[0])}" cy="${f1(fc[1])}" r="9.2" fill="${SK}"/><circle cx="${f1(ey[0])}" cy="${f1(ey[1])}" r="1.2" fill="#1b1b1b"/>`;
  // near arm
  s+=cap(o.elb,o.hand,4.3,3.4,SK);if(has('fa'))s+=cap(mixp(o.elb,o.hand,.1),mixp(o.elb,o.hand,.6),4,3.3,HLC,op);
  s+=cap(o.sh,o.elb,5.8,4.5,SK);if(has('ua'))s+=cap(mixp(o.sh,o.elb,.4),mixp(o.sh,o.elb,.9),5.2,4.2,HLC,op);
  s+=cap(o.sh,mixp(o.sh,o.elb,.42),6.6,5.8,SHIRTD);
  if(has('shoulder'))s+=`<circle cx="${f1(o.sh[0])}" cy="${f1(o.sh[1])}" r="7" fill="${HLC}" opacity="${op.toFixed(2)}"/>`;
  s+=`<circle cx="${f1(o.hand[0])}" cy="${f1(o.hand[1])}" r="3.8" fill="${SK}"/>`;
  return s;
}
function drawFig(ex,k,showAng){
  const pose=ex.pose,o=poseAt(pose,k),eq=pose.eq||{};
  let s='';
  if(!pose.nofloor)s+=`<line x1="0" y1="187" x2="240" y2="187" stroke="#3a4150" stroke-width="2"/>`;
  if(eq.bench){const[b1,b2,b3,b4]=eq.bench;s+=ln([b1,b2],[b3,b4],9,'#3a4150');const mx=(b1+b3)/2,my=(b2+b4)/2;if(my<180)s+=ln([mx,my],[mx,187],5,'#3a4150')}
  if(eq.pull!=null)s+=ln([50,eq.pull],[190,eq.pull],5,'#55607a');
  if(eq.dip){s+=ln([eq.dip[0]-20,eq.dip[1]],[eq.dip[0]+20,eq.dip[1]],6,'#55607a')+ln([eq.dip[0]+16,eq.dip[1]],[eq.dip[0]+16,210],4,'#3a4150')}

  if(eq.bar==='shoulder')s+=plate([o.sh[0]-3,o.sh[1]-3]);
  s+=person(o,HL[ex.id]||[],k,pose.sup);
  if(eq.bar==='hand')s+=plate(o.hand);
  if(eq.bar==='hip'){const td=dirv(o.t);s+=plate([o.hip[0]+(-td[1])*0-2,o.hip[1]-16])}
  if(eq.db)s+=`<rect x="${(o.hand[0]-9).toFixed(1)}" y="${(o.hand[1]-4).toFixed(1)}" width="18" height="8" rx="2" fill="#55607a"/><rect x="${(o.hand[0]-11).toFixed(1)}" y="${(o.hand[1]-7).toFixed(1)}" width="5" height="14" rx="2" fill="#8a93a3"/><rect x="${(o.hand[0]+6).toFixed(1)}" y="${(o.hand[1]-7).toFixed(1)}" width="5" height="14" rx="2" fill="#8a93a3"/>`;
  if(eq.pad)s+=`<circle cx="${o.ank[0].toFixed(1)}" cy="${(o.ank[1]-6).toFixed(1)}" r="6" fill="#55607a"/>`;
  if(showAng)(pose.show||[]).forEach(j=>{
    let v;
    if(j==='knee')v=[o.knee,o.hip,o.ank];else if(j==='hip')v=[o.hip,o.knee,o.sh];else if(j==='elbow')v=[o.elb,o.sh,o.hand];else if(j==='knee2'&&o.knee2)v=[o.knee2,o.hip,o.ank2];

}

function targets(){
  const p=S.profile;if(!p)return null;
  const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*({1:1.2,2:1.375,3:1.55,4:1.725}[p.act]||1.375);
  const kcal=p.goal==='cut'?tdee*0.8:p.goal==='bulk'?tdee*1.1:tdee;
  const prot=p.w*(p.goal==='cut'?2.0:1.8);
  const fat=Math.max(kcal*0.25/9,p.w*0.6);
  const carb=Math.max(0,(kcal-prot*4-fat*9)/4);
  const water=p.w*0.035+0.75;
  const low=kcal<(p.sex==='m'?1500:1200);
  return{bmr,tdee,kcal,prot,fat,carb,water,low};
}
function dayTotals(d){const L0=(S.food[d]||[]);const o={k:0,p:0,cb:0,f:0};L0.forEach(e=>{const f=FM(e.id);if(f){o.k+=f.k*e.q;o.p+=f.p*e.q;o.cb+=f.cb*e.q;o.f+=f.f*e.q}});return o}

  <div class="list">${fl.map(f=>`<div class="it" data-act="fpick" data-id="${f.id}"><span>${esc(L(f.n))}<br><span class="mut">${esc(L(f.s))}</span></span><span class="mut" style="direction:ltr;text-align:end;white-space:nowrap">${f.k} kcal<br>${f.p}P · ${f.cb}C · ${f.f}F</span></div>`).join('')||'<p class="mut">—</p>'}</div>
  <p class="mut" style="font-size:12px">${t('est')}</p></div>`;
  h+=`<details><summary>➕ ${t('custom')}</summary>
  <label>${t('name')}</label><input id="cn"><label>${t('serv')}</label><input id="cs" placeholder="100 g">
  <div class="f2"><div><label>kcal</label><input id="ck" type="number" inputmode="decimal"></div><div><label>${t('prot')} g</label><input id="cp" type="number" inputmode="decimal"></div><div><label>${t('carb')} g</label><input id="cc" type="number" inputmode="decimal"></div><div><label>${t('fat')} g</label><input id="cf" type="number" inputmode="decimal"></div></div>
  <button class="btn" style="margin-top:10px" data-act="csave">${t('saveF')}</button></details>`;
  const st={k:0,p:0,cb:0,f:0};SAMPLE.forEach(([m,id,qq])=>{const f=FM(id);st.k+=f.k*qq;st.p+=f.p*qq;st.cb+=f.cb*qq;st.f+=f.f*qq});
  h+=`<details><summary>🍽️ ${t('sample')}</summary>${['bf','lu','sn','di'].map(m=>`<h3>${t(m)}</h3><ul class="b">${SAMPLE.filter(x=>x[0]===m).map(([_,id,qq])=>{const f=FM(id);return `<li>${esc(L(f.n))} — ${esc(L(f.s))} ×${qq}</li>`}).join('')}</ul>`).join('')}
  <p><b style="direction:ltr;display:inline-block">${r0(st.k)} kcal · ${r0(st.p)}g P · ${r0(st.cb)}g C · ${r0(st.f)}g F</b></p>
  ${tg?`<p class="ok">${t('scale')} <b style="direction:ltr;display:inline-block">×${(tg.kcal/st.k).toFixed(2)}</b></p>`:''}</details>`;
  h+=`<details><summary>⭐ ${t('nTips')}</summary><ul class="b">${NTIPS.map(x=>`<li>${esc(L(x))}</li>`).join('')}</ul></details>`;
  return h;
}
function vProfile(){
  const p=S.profile||{sex:'m',age:28,h:175,w:80,act:3,goal:'cut'},tg=targets();
  const opt=(v,cur,lb)=>`<option value="${v}" ${String(v)===String(cur)?'selected':''}>${lb}</option>`;
  let h=`<div class="card"><h2>🔥 ${t('calc')}</h2>
  <div class="f2"><div><label>${t('sex')}</label><select id="psex">${opt('m',p.sex,t('male'))}${opt('f',p.sex,t('female'))}</select></div>
  <div><label>${t('age')}</label><input id="page" type="number" inputmode="numeric" value="${p.age}"></div>
  <div><label>${t('height')}</label><input id="ph" type="number" inputmode="numeric" value="${p.h}"></div>
  <div><label>${t('weight')}</label><input id="pw" type="number" inputmode="decimal" value="${p.w}"></div></div>
  <label>${t('act')}</label><select id="pact">${[1,2,3,4].map(i=>opt(i,p.act,t('a'+i))).join('')}</select>
  <label>${t('goal')}</label><select id="pgoal">${opt('cut',p.goal,t('cut'))}${opt('main',p.goal,t('main'))}${opt('bulk',p.goal,t('bulk'))}</select>
  <button class="btn" style="margin-top:12px;width:100%" data-act="psave">${t('saveP')}</button></div>`;
  if(tg)h+=`<div class="card"><div class="row between"><span class="mut">${t('bmr')}</span><b style="direction:ltr">${r0(tg.bmr)} kcal</b></div>
  <div class="row between"><span class="mut">${t('tdee')}</span><b style="direction:ltr">${r0(tg.tdee)} kcal</b></div>
  <h3>${t('yourT')}</h3><div class="kpi"><div><b>${r0(tg.kcal)}</b><span>kcal</span></div><div><b>${r0(tg.prot)}g</b><span>${t('prot')}</span></div><div><b>${r0(tg.carb)}g</b><span>${t('carb')}</span></div><div><b>${r0(tg.fat)}g</b><span>${t('fat')}</span></div></div>
  <p class="mut" style="margin:8px 0 0">💧 ${t('water')}: ${tg.water.toFixed(1)} ${t('litre')} · ${t('rate')}</p>
  ${tg.low?`<p style="color:var(--warn)">⚠️ ${t('lowWarn')}</p>`:''}
  <p class="mut" style="font-size:12px;margin:6px 0 0">Mifflin-St Jeor</p></div>`;
  h+=`<div class="card"><h2>⚙️</h2><label>${t('level')}</label><div class="chips">${['beg','int','adv'].map(l=>`<span class="chip ${S.prog===l?'on':''}" data-act="lvl" data-l="${l}">${t(l)}</span>`).join('')}</div>
  <label>${t('lang')}</label><div class="chips"><span class="chip ${S.lang==='ar'?'on':''}" data-act="setlang" data-l="ar">العربية</span><span class="chip ${S.lang==='en'?'on':''}" data-act="setlang" data-l="en">English</span></div></div>
  <div class="card"><h2>📲 ${t('install')}</h2><p class="mut" style="margin:0">${t('instTx')}</p></div>
  <div class="card"><h2>💾 ${t('backup')}</h2><button class="btn sec" data-act="copy">${t('copy')}</button>
  <label>${t('imp')}</label><textarea id="impx" rows="3" style="direction:ltr"></textarea><button class="btn sec" style="margin-top:6px" data-act="imp">${t('impBtn')}</button>
  <div style="margin-top:14px"><button class="btn sec" style="color:var(--bad)" data-act="reset">${resetArm?t('sure'):t('reset')}</button></div></div>
  <div class="card warn" style="font-size:13px">⚠️ ${t('disc')}</div>`;
  return h;
}

/* ============ EXERCISE SHEET ============ */
let anim=null,playing=true,curEx=null,phase=0,lastTs=0;
function openEx(id){
  curEx=EXM[id];playing=true;phase=0;
  const e=curEx;
  const logs=(S.logs[id]||[]);
  $('#pan').innerHTML=`<div class="row between" style="margin-bottom:8px"><div><h2 style="margin:0">${L(e.n)}</h2><span class="tag">${t(e.g)}</span></div><button class="x" data-act="close">✕</button></div>
  ${e.pose?`<div class="fig"><div id="figbox">${drawFig(e,0,true)}</div><div class="row between" style="padding:4px 8px 6px"><span class="mut"><span id="phl">${t('start')}</span> · <span style="color:#ff3b3b">●</span> ${t('working')}</span><button class="btn sec sm" data-act="pp" id="ppb">${t('play')}</button></div>${G3.ok!==false?`<div class="mut" style="font-size:12px;padding:0 8px 6px">👆 ${t('rot')}</div>`:''}</div>`:`<div class="card mut">${t('noFig')}</div>`}
  <p style="margin:10px 0 4px"><b>${t('muscles')}:</b> ${esc(L(e.m))}</p>
  <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.q)}" target="_blank" rel="noopener">${t('video')}</a>
  ${[['s','stepsH','🧭'],['a','anglesH','📐'],['x','mistH','❌'],['p','proH','🏆']].map(([k,lb,ic])=>`<h3>${ic} ${t(lb)}</h3><ul class="b">${L(e[k]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}
  <div class="card" style="margin-top:12px"><h2>📝 ${t('logH')}</h2>
  <div class="f2"><div><label>${t('kg')}</label><input id="lw" type="number" inputmode="decimal" value="${logs.length?logs[logs.length-1].w:''}"></div><div><label>${t('reps')}</label><input id="lr" type="number" inputmode="numeric" value="${logs.length?logs[logs.length-1].r:''}"></div></div>
  <button class="btn" style="margin-top:8px;width:100%" data-act="lset">${t('addSet')}</button><div id="lhist">${logHist(id)}</div>
  <p class="mut" style="font-size:12.5px;margin:8px 0 0">📈 ${t('progHint')}</p></div>`;
  $('#sheet').classList.add('open');
  if(e.pose){cancelAnimationFrame(anim);lastTs=0;anim=requestAnimationFrame(tick)}
}
function logHist(id){
  const logs=S.logs[id]||[];if(!logs.length)return `<p class="mut">${t('noLog')}</p>`;
  const by={};logs.forEach((l,i)=>{(by[l.d]=by[l.d]||[]).push({...l,i})});
  const days=Object.keys(by).sort().reverse();const td=today();
  const best=Math.max(...logs.map(l=>l.w*(1+l.r/30)));
  let h='';
  if(by[td])h+=`<h3>${t('todaySets')}</h3><div class="sets">${by[td].map(l=>`<span>${l.w}kg × ${l.r} <button class="del" data-act="ldel" data-i="${l.i}">✕</button></span>`).join('')}</div>`;
  const last=days.find(d=>d!==td);
  if(last)h+=`<h3>${t('lastS')} <span class="mut" style="direction:ltr">${last}</span></h3><div class="sets">${by[last].map(l=>`<span>${l.w}kg × ${l.r}</span>`).join('')}</div>`;
  h+=`<p class="mut" style="margin:8px 0 0">${t('best')}: <b class="ok" style="direction:ltr">${r0(best)} kg</b></p>`;
  return h;
}
function tick(ts){
  if(!curEx||!$('#sheet').classList.contains('open'))return;
  if(!lastTs)lastTs=ts;const dt=(ts-lastTs)/1000;lastTs=ts;
  if(playing)phase=(phase+dt/3.6)%1;
  // 0-.35 go, .35-.5 hold, .5-.85 back, .85-1 hold
  let k=phase<.35?phase/.35:phase<.5?1:phase<.85?1-(phase-.5)/.35:0;
  k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  const fb=$('#figbox');if(fb){if(init3()){try{draw3(curEx,k,fb)}catch(err){console.log(err);G3.ok=false;fb.innerHTML=drawFig(curEx,k,true)}}else fb.innerHTML=drawFig(curEx,k,true)}
  const pl=$('#phl');if(pl)pl.textContent=k>.98?t('end'):k<.02?t('start'):'…';
  anim=requestAnimationFrame(tick);
}
function closeSheet(){$('#sheet').classList.remove('open');cancelAnimationFrame(anim);curEx=null;render()}

/* food picker */
function openFood(id){
  const f=FM(id);let q=1,m=(()=>{const h=new Date().getHours();return h<11?'bf':h<16?'lu':h<20?'sn':'di'})();
  const draw=()=>{$('#pan').innerHTML=`<div class="row between"><h2 style="margin:0">${esc(L(f.n))}</h2><button class="x" data-act="close">✕</button></div>
  <p class="mut">${esc(L(f.s))} · ${f.k} kcal · ${f.p}P ${f.cb}C ${f.f}F</p>
  <label>${t('serv')}</label><div class="qty"><button data-act="qm">−</button><b>×${q}</b><button data-act="qp">+</button></div>
  <label>${t('meal')}</label><div class="chips">${['bf','lu','di','sn'].map(x=>`<span class="chip ${x===m?'on':''}" data-act="qmeal" data-m="${x}">${t(x)}</span>`).join('')}</div>
  <p><b style="direction:ltr;display:inline-block">${r0(f.k*q)} kcal · ${r0(f.p*q)}g P · ${r0(f.cb*q)}g C · ${r0(f.f*q)}g F</b></p>
  <button class="btn" style="width:100%" data-act="qadd">${t('add')}</button>`};
  foodPick={get q(){return q},set q(v){q=v},get m(){return m},set m(v){m=v},f,draw};
  draw();$('#sheet').classList.add('open');
}
let foodPick=null;

/* ============ EVENTS ============ */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el){if(ev.target.id==='sheet')closeSheet();return}
  const a=el.dataset.act;
  switch(a){
  case 'go':view=el.dataset.v;try{history.replaceState(null,'','#'+view)}catch(e){location.hash=view}render();scrollTo(0,0);break;
  case 'lang':S.lang=S.lang==='ar'?'en':'ar';save();render();break;
  case 'setlang':S.lang=el.dataset.l;save();render();break;
  case 'lvl':S.prog=el.dataset.l;save();render();break;
  case 'ex':openEx(el.dataset.id);break;
  case 'close':closeSheet();break;
  case 'pp':playing=!playing;el.textContent=playing?t('play'):t('pause');break;
  case 'done':{const P=PROG[S.prog];S.next[S.prog]=((S.next[S.prog]||0)+1)%P.days.length;(S.done=S.done||[]).push(today());save();toast(t('saved'));render();break}
  case 'exf':exFilter=el.dataset.g;render();break;
  case 'lset':{const w=parseFloat($('#lw').value),r=parseInt($('#lr').value);if(!(w>=0)||!(r>0))return;(S.logs[curEx.id]=S.logs[curEx.id]||[]).push({d:today(),w,r});save();$('#lhist').innerHTML=logHist(curEx.id);toast(t('added'));break}
  case 'ldel':S.logs[curEx.id].splice(+el.dataset.i,1);save();$('#lhist').innerHTML=logHist(curEx.id);break;
  case 'fd':{const d=new Date(foodDate+'T12:00:00');d.setDate(d.getDate()+(+el.dataset.d)*(1));foodDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');render();break}
  case 'fc':foodCat=el.dataset.c;foodQ='';render();break;
  case 'fpick':openFood(el.dataset.id);break;
  case 'qm':foodPick.q=Math.max(.5,foodPick.q-.5);foodPick.draw();break;
  case 'qp':foodPick.q=foodPick.q+.5;foodPick.draw();break;
  case 'qmeal':foodPick.m=el.dataset.m;foodPick.draw();break;
  case 'qadd':(S.food[foodDate]=S.food[foodDate]||[]).push({id:foodPick.f.id,q:foodPick.q,m:foodPick.m});save();toast(t('added'));closeSheet();break;
  case 'fdel':S.food[foodDate].splice(+el.dataset.i,1);save();render();break;
  case 'csave':{const n=$('#cn').value.trim(),k=parseFloat($('#ck').value);if(!n||!(k>=0))return;
    const s=$('#cs').value.trim()||'1';(S.custom=S.custom||[]).push({id:'c_'+Date.now(),c:'mine',n:{ar:n,en:n},s:{ar:s,en:s},k,p:+$('#cp').value||0,cb:+$('#cc').value||0,f:+$('#cf').value||0});
    save();foodCat='mine';toast(t('saved'));render();break}
  case 'psave':{const p={sex:$('#psex').value,age:+$('#page').value,h:+$('#ph').value,w:+$('#pw').value,act:+$('#pact').value,goal:$('#pgoal').value};
    if(!(p.age>10&&p.h>100&&p.w>30))return;S.profile=p;save();toast(t('saved'));render();break}
  case 'copy':{const txt=JSON.stringify(S);const done=()=>toast(t('copied'));try{navigator.clipboard.writeText(txt).then(done,()=>{$('#impx').value=txt;$('#impx').select()})}catch(e){$('#impx').value=txt;$('#impx').select()}break}
  case 'imp':try{const o=JSON.parse($('#impx').value);if(o&&typeof o==='object'){S=Object.assign(S,o);save();toast(t('saved'));render()}}catch(e){toast('✕ JSON')}break;
  case 'reset':if(!resetArm){resetArm=true;render();setTimeout(()=>{resetArm=false},4000)}else{S={lang:S.lang,prog:'beg',next:{beg:0,int:0,adv:0},done:[],profile:null,logs:{},food:{},custom:[]};resetArm=false;save();render()}break;
  }
});
document.addEventListener('input',ev=>{
  const k=ev.target.dataset&&ev.target.dataset.in;
  if(k==='exq'){exQ=ev.target.value;render()}
  if(k==='fq'){foodQ=ev.target.value;render()}
});
window.gpBack=function(){ // Android back button
  if($('#sheet').classList.contains('open')){closeSheet();return true}
  if(view!=='home'){view='home';render();scrollTo(0,0);return true}
  return false;
};
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==view){view=v;render()}});
render();
</script>
