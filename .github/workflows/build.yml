name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk GymPro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GymPro-APK
          path: GymPro.apk

      - name: Publish to Releases (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GymPro – latest build
          body: "Download **GymPro.apk** below and open it on your Android phone."
          files: GymPro.apk
          make_latest: true
